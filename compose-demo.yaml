services:
  dind:
    image: docker:29-dind
    privileged: true
    restart: no
    cpus: 2
    mem_limit: 2g
    pids_limit: 512
    environment:
      - DOCKER_TLS_CERTDIR=
    command:
      - dockerd
      - --host=unix:///var/run/docker.sock
      - --tls=false
    volumes:
      - dind-socket:/var/run
      - dind-data:/var/lib/docker
    healthcheck:
      test: ["CMD-SHELL", "docker --host=unix:///var/run/docker.sock info >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    privileged: true
    restart: no
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 128
    depends_on:
      dind:
        condition: service_healthy
    environment:
      - SOCKET_PATH=/var/run/docker.sock
      - EVENTS=1
      - PING=1
      - VERSION=1
      - AUTH=0
      - SECRETS=0
      - POST=1
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - CONTAINERS=1
      - DISTRIBUTION=0
      - EXEC=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - NODES=0
      - PLUGINS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=1
    volumes:
      - dind-socket:/var/run

  main:
    image: ghcr.io/getarcaneapp/arcane:latest
    restart: no
    pull_policy: missing
    cpus: 2
    mem_limit: 2g
    pids_limit: 512

    volumes:
      - arcane-data:/app/data
      - arcane-projects:/app/data/projects

    environment:
      - APP_URL=${APP_URL:-http://localhost:3003}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - DOCKER_HOST=tcp://docker-socket-proxy:2375

    networks:
      - default
      - demo-kuma
    depends_on:
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3552/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      options:
        max-size: 10m
        max-file: "2"

networks:
  demo-kuma:
    external: true
    name: ${DOCKER_NETWORK_NAME:-demo-kuma_default}

volumes:
  arcane-data:
  arcane-projects:
  dind-data:
  dind-socket:
