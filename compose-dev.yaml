name: demo-kuma

services:
  demo-kuma:
    image: louislam/demo-kuma:nightly
    restart: unless-stopped
    ports:
      - 3003:80
    command: tsx watch --inspect ./server.ts
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - demo-kuma-runtime:/app/runtime
    environment:
      - NODE_ENV=development

      # Demo Website Name
      - WEBSITE_NAME=Arcane Demo

      # Stack Prefix (Should a special prefix, because demo-kuma will manage (start/shutdown) all stacks with this)
      - STACK_PREFIX=arcane-demo

      # Specify the service name of the stack
      - STACK_MAIN_SERVICE_NAME=main

      # Specify the port of the service
      - STACK_MAIN_SERVICE_PORT=3552

      # The entry path of the demo
      # Should be start with /
      - STACK_MAIN_SERVICE_ENTRY_PATH=/

      # The health path used to check readiness
      - STACK_HEALTH_PATH=/api/health

      # Public URL users visit for this demo site.
      # Arcane uses this for redirects and websocket/client URL generation.
      - APP_URL=${APP_URL:-http://localhost:3003}

      # Session Time (Seconds)
      - SESSION_TIME=300

      # If the stack has not started in time, it will be considered as failed (Seconds)
      - START_TIMEOUT=10

      # Show Entry
      # If true, the entry will be shown in the demo page and the user has to click "Start Demo" to start the demo
      # true / false
      - SHOW_ENTRY=false

      # Public landing/install URL for the product itself
      - INSTALL_URL=https://demo.getarcane.app

      # Optional Arcane secrets override.
      # If omitted, the container will generate them with openssl on first boot
      # and persist them in /app/runtime.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}

      # Docker Network Name
      # The demo instance must be in the same network as the demo-kuma
      - DOCKER_NETWORK_NAME=demo-kuma_default

volumes:
  demo-kuma-runtime:
